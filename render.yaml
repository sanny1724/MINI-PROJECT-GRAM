# render.yaml
services:
  # GRAM Express Backend API Service
  - type: web
    name: gram-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && npm start
    cwd: backend
    envVars:
      - key: PORT
        value: 3001
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://taskwexaai.netlify.app # Replace with your actual Netlify frontend URL
      - key: DATABASE_URL
        fromDatabase:
          name: gram-db
          property: connectionString

databases:
  # GRAM PostgreSQL Database
  - name: gram-db
    plan: free
